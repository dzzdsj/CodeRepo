<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./lib/vue-2.4.0.js"></script>
    <link rel="stylesheet" href="./lib/bootstrap-3.3.7.css"></link>
</head>

<body>
    <div id="app">
        <div class="panel panel-primary">  
            <div class="panel-heading">
                <h3 class="panel-title">添加品牌</h3>
            </div>
            <div class="panel-body">
                <label>
                    Id:
                    <input type="text" class="form-control" v-model="id">
                </label>
                <label>
                    Name:
                    <input type="text"  v-model="name">
                </label>
                <input type="button" class="btn btn-primary" value="添加" @click="add">
            </div>
        </div>
        <table class="table table-bordered" table-hover table-striped>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Ctime</th>
                    <th>Operation</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="item in list" :key="item.id">
                    <td>{{ item.id }}</td>
                    <td>{{ item.name }}</td>
                    <td>{{ item.ctime }}</td>
                    <td>
                        <a href="" @click.prevent="del(item.id)">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        var app = new Vue({
            el: '#app',
            id: '',
            name: '',
            data: {
                list: [
                    { id: 1, name: '苹果', ctime: new Date() },
                    { id: 2, name: '华为', ctime: new Date() },
                    { id: 3, name: '小米', ctime: new Date() },
                    { id: 4, name: 'OPPO', ctime: new Date() }
                ]
            },
            methods: {
                add: function () {
                    this.list.push({
                        id: this.id,
                        name: this.name,
                        ctime: new Date()
                    })
                    this.id = ''
                    this.name = ''
                },
                del: function (id) {
                    this.list = this.list.filter(function (item) {
                        return item.id !== id
                    })
                }
            }
        })
    </script>
</body>

</html>
